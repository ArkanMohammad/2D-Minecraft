<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D Minecraft Grid</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Start Screen -->
    <section id="startScreen">
        <header class="menuContent">
            <h2 class="authorTitle">By Arkan Mohamad</h2>
            <button id="playButton">Let's Play</button>
        </header>
    </section>
    <!-- Game Container -->
    <section id="gameContainer">
        <!-- Left Sidebar -->
        <article class="leftSidebar">
            <!-- Mining Tools -->
            <aside id="toolsSidebar">
                <h3>Mining Tools</h3>
                <button class="blockSelector" data-type="shovel">
                    <span> 🥄  Shovel</span>
                </button>
                <button class="blockSelector" data-type="pickaxe">
                    <span> ⛏️  Pickaxe</span>
                </button>
                <button class="blockSelector" data-type="axe">
                    <span> 🪓  Axe</span>
                </button>
            </aside>
            <!-- Block Inventory -->
            <aside id="sidebar">
                <h3>Block Inventory</h3>
                <button class="blockSelector active" data-type="grass">
                    <i class="colorPreview grass"></i>
                    <span>Grass:
                        <strong id="countGrass">0</strong>
                    </span>
                </button>
                <button class="blockSelector" data-type="dirt">
                    <i class="colorPreview dirt"></i>
                    <span>Dirt:
                        <strong id="countDirt">0</strong>
                    </span>
                </button>

                <button class="blockSelector" data-type="stone">
                    <i class="colorPreview stone"></i>
                    <span>Stone:
                        <strong id="countStone">0</strong>
                    </span>
                </button>
            </aside>
        </article>
        <!-- Game Canvas -->
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <aside id="instructionsSidebar">
            <h3>Instructions</h3>
            <p><strong>Tools:</strong></p>
            <p>🥄 Shovel → Mine Dirt</p>
            <p>⛏️ Pickaxe → Mine Stone</p>
            <p>🪓 Axe → Cut Grass & Flowers</p>
            <hr class="instructionDivider">
            <p><strong>Building:</strong></p>
            <ul class="instructionList">
                <li>Select a block from the Block Inventory.</li>
                <li>Click a sky block to place it.</li>
            </ul>
            <hr class="instructionDivider">
            <p><strong>Movement:</strong></p>
            <p>A / D → Move</p>
            <p>Space → Jump</p>
        </aside>
    </section>
    <!-- Hidden YouTube Player -->
    <section id="youtubePlayer"></section>
    <!-- JavaScript Files -->
    <script src="src/core/app.js"></script>
    <script src="src/core/grid.js"></script>
    <script src="src/entities/blockManager.js"></script>
    <script src="src/entities/player.js"></script>
</body>
</html>
